services:
  - type: web
    name: trading-api
    plan: free
    runtime: node
    region: oregon
    rootDir: trading-backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: trading-db
          property: connectionString
      - key: REDIS_ENABLED
        value: "false"
      - key: CACHE_TTL
        value: "3600"
      - key: MT5_ENCRYPTION_KEY
        sync: false
      # Supabase Storage Configuration
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: S3_BUCKET_NAME
        value: "screenshots"
      - key: MAX_FILE_SIZE
        value: "5242880"

databases:
  - name: trading-db
    plan: free
    databaseName: trading_dashboard
