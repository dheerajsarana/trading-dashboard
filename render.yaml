services:
  - type: web
    name: trading-api
    plan: free
    runtime: node
    region: oregon
    rootDir: trading-backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: trading-db
          property: connectionString
      - key: REDIS_ENABLED
        value: "false"

databases:
  - name: trading-db
    plan: free
    databaseName: trading_dashboard
